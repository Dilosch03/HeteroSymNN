[tox]
# Define the target environments
envlist = py310, py311, py312, py313
# Tells tox we are using standard modern building (setup.py or pyproject.toml)
isolated_build = True

[testenv]
# What dependencies need to be installed in every environment?
deps =
    pytest
    matplotlib>=3.10
    numpy>=2.0
    sympy>=1.10
    cupy-cuda12x>=12.0.0

# What command should be run to verify the engine works?
commands =
    pytest